apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: my-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
          env:
            - name: BACKEND_URL
              value: "http://backend:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  ports:
    - port: 4200
      nodePort: 30420
  selector:
    app: frontend